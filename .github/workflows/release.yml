# Terraform Provider release workflow.
name: Release
# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created, or when manually triggered.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The GPG_PRIVATE_KEY and PASSPHRASE secrets belong in this environment,
    # not in repository secrets. Protect it (Settings > Environments > release)
    # with required reviewers and deployment rules that allow only main (for
    # manual runs) and tags matching v*, so a run from another branch cannot
    # read the key.
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0

      # Create and push tag if manual trigger.
      # The tag comes from user input. It is passed through an env var, never
      # pasted into the script, and checked before use, so it cannot inject
      # shell commands.
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          git config user.name "Walid ETTAYEB"
          git config user.email walid@ettayeb.fr
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      # go.mod says go 1.26.0, the minimum. Build releases with the latest
      # 1.26 patch so they carry the current standard library fixes.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          check-latest: true
          # No build cache in the release job: a cache written by another
          # workflow run could change what gets signed.
          cache: false

      # Fail instead of letting the release rewrite go.mod or go.sum.
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
